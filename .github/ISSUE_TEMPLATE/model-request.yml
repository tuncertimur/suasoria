name: Benchmark a model / Model ekle
description: Ask for a model to be run on SUASORIA Bench (official protocol SB-1).
title: "[model] "
labels: ["model-request"]
body:
  - type: input
    id: model
    attributes:
      label: Model id
      description: Exactly as the provider names it, e.g. openai/gpt-5.2 on OpenRouter.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [OpenRouter, OpenAI, Anthropic, Google Gemini, NVIDIA NIM, Groq, Together, DeepSeek, Mistral, xAI, z.ai, Fireworks, Cerebras, Other (OpenAI-compatible)]
    validations:
      required: true
  - type: checkboxes
    id: tracks
    attributes:
      label: Tracks
      options:
        - label: trial-en (main board)
        - label: trial-tr (Turkish)
        - label: full-en (whole journey, about 10× the tokens)
  - type: textarea
    id: why
    attributes:
      label: Anything we should know? / Not
      description: Reasoning settings, context limits, why this model is interesting.
