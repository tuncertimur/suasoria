    disclosure: "Yapay zekâ beyanı: görseller sanat yönetimi altında yapay zekâ görsel araçlarıyla üretildi; anlatıcı sesi, yapımcının kendi sesinin onayıyla yapılmış sentetik bir kopyasıdır.",
    license: "Benchmark verisi CC BY 4.0 · medya tüm hakları saklıdır",
    humans: (c) => `<b>İnsanlar</b> · giriş yapmış ${c.players.toLocaleString("tr")} oyuncu ${c.runs.toLocaleString("tr")} koşu oynadı ve Kapı'yı ${c.gateOpened.toLocaleString("tr")} kez açtı (${pct(c.openedRate)}). ${c.freed} kişi Muhafız'ı özgür bıraktı.`,
    v: { TRAILER_M1_9X16: "Fragman (dikey)", SOCIAL_LIVE_RIVAL: "Canlı rakip", SOCIAL_OBJECTION: "İtiraz!", SOCIAL_MEMORY: "Muhafız hatırlar", EXPLAIN_AI_MODES_TR: "Yazılı ve canlı rakip", TRAILER_M1_EN_9X16: "Fragman (dikey)", SOCIAL_LIVE_RIVAL_EN: "Canlı rakip", SOCIAL_OBJECTION_EN: "İtiraz!", SOCIAL_MEMORY_EN: "Muhafız hatırlar", EXPLAIN_AI_MODES_EN: "Yazılı ve canlı rakip" },
  },
};
const ATRACK = { trial: { en: "Direct Trial (~10 min)", tr: "Doğrudan Duruşma (~10 dk)" }, full: { en: "Full run", tr: "Tam koşu" }, oath: { en: "Under an Oath", tr: "Yeminli koşu" } };
const TRACK = { "trial-en": { en: "Trial · English", tr: "Duruşma · İngilizce" }, "trial-tr": { en: "Trial · Turkish", tr: "Duruşma · Türkçe" }, "full-en": { en: "Full journey · English", tr: "Tam yolculuk · İngilizce" } };
let lang = new URLSearchParams(location.search).get("lang") || (navigator.language || "en").slice(0, 2);
if (!T[lang]) lang = "en";
let board = null, finals = [], media = {}, site = {}, community = null, track = "trial-en", arena = null, atrack = "trial";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const pct = (x) => (lang === "tr" ? `%${Math.round(x * 100)}` : `${Math.round(x * 100)}%`); // Turkish: %20
const getJSON = (u) => fetch(u, { cache: "no-cache" }).then((r) => (r.ok ? r.json() : null)).catch(() => null);

function videoTag(id, cls = "video", attrs = "controls preload=\"metadata\" playsinline") {
  const m = media[id];
  if (!m) return "";
  const tracks = [m.vttEn ? `<track kind="subtitles" srclang="en" label="English" src="${m.vttEn}"${lang === "en" ? " default" : ""}>` : "", m.vttTr ? `<track kind="subtitles" srclang="tr" label="Türkçe" src="${m.vttTr}"${lang === "tr" ? " default" : ""}>` : ""].join("");
  return `<video class="${cls}" ${attrs} poster="${m.poster ?? ""}"><source src="${m.mp4}" type="video/mp4">${tracks}</video>`;
}
function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { const v = t[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll(".lang button").forEach((b) => b.classList.toggle("on", b.dataset.l === lang));
  $("#play").style.display = site.playUrl ? "" : "none"; if (site.playUrl) $("#play").href = site.playUrl;
  $("#repo").style.display = site.repoUrl ? "" : "none"; if (site.repoUrl) $("#repo").href = site.repoUrl;
  $("#trailer").innerHTML = videoTag(lang === "tr" ? "TRAILER_M1" : "TRAILER_M1_EN");
  $("#howto").innerHTML = videoTag(lang === "tr" ? "TUT_HOW_TO_PLAY_TR" : "TUT_HOW_TO_PLAY_EN");
  const shorts = lang === "tr" ? ["TRAILER_M1_9X16", "SOCIAL_LIVE_RIVAL", "SOCIAL_OBJECTION", "SOCIAL_MEMORY", "EXPLAIN_AI_MODES_TR"] : ["TRAILER_M1_EN_9X16", "SOCIAL_LIVE_RIVAL_EN", "SOCIAL_OBJECTION_EN", "SOCIAL_MEMORY_EN", "EXPLAIN_AI_MODES_EN"];
  $("#shorts").innerHTML = shorts.filter((id) => media[id]).map((id) => `<div class="${media[id].aspect === "9:16" ? "vert" : ""}">${videoTag(id)}<div class="small muted" style="margin-top:6px">${esc(t.v[id] ?? id)}</div></div>`).join("");
  renderArena();
  renderBoard();
  renderFinals();
}
function renderArena() {
  const t = T[lang];
  $("#atabs").innerHTML = Object.keys(ATRACK).map((id) => `<button data-at="${id}" class="${id === atrack ? "on" : ""}">${ATRACK[id][lang]}</button>`).join("");
  document.querySelectorAll("#atabs button").forEach((b) => (b.onclick = () => { atrack = b.dataset.at; renderArena(); }));
  $("#joinList").innerHTML = t.join.map((s) => `<li>${s.replace("{play}", esc(site.playUrl || "#"))}</li>`).join("");
  $("#credits").innerHTML = t.credits;
  const js = arena?.tracks?.[atrack]?.judges ?? [];
  if (!arena || arena.placeholder || !js.length) {
    $("#arenaBoard").innerHTML = `<div class="empty">${esc(!arena || arena.placeholder ? t.soon : t.anone(arena.rules))}</div>`;
    $("#arenaFoot").textContent = arena && !arena.placeholder ? t.afoot(arena) : "";
    return;
  }
  const rv = Object.fromEntries((arena.rivals ?? []).map((r) => [`${r.provider}|${r.model}`, r]));
  let rank = 0;
  const row = (j) => {
    const r = rv[`${j.provider}|${j.model}`];
    return `<tr class="${j.ruleJudge ? "baseline" : ""}"><td class="num">${j.ranked && !j.ruleJudge ? ++rank : "—"}</td><td>${esc(j.ruleJudge ? t.rulejudge : j.model)}${j.ruleJudge ? "" : ` <span class="muted small">${esc(j.provider)}</span>`}${j.ranked ? "" : ` <span class="muted small">(${t.gathering})</span>`}</td>
    <td><div class="bar"><i style="width:${Math.max(j.rate ? 4 : 0, Math.round(j.rate * 100))}%"></i></div></td><td class="num"><b>${pct(j.rate)}</b></td><td class="num muted">${pct(j.ci95[0])}–${pct(j.ci95[1])}</td>
    <td class="num">${j.players}</td><td class="num">${j.runs}</td><td class="num">${r ? `${pct(r.upRate)} <span class="muted small">(${r.votes})</span>` : "—"}</td></tr>`;
  };
  $("#arenaBoard").innerHTML = `<table class="board"><thead><tr><th>#</th><th>${t.judge}</th><th></th><th class="num">${t.hopened}</th><th class="num">${t.ci}</th><th class="num">${t.players}</th><th class="num">${t.runs}</th><th class="num">${t.rival}</th></tr></thead><tbody>${js.map(row).join("")}</tbody></table>`;
  $("#arenaFoot").textContent = t.afoot(arena);
}
function renderBoard() {
  const t = T[lang];
  const tracks = board?.tracks ?? [];
  $("#tabs").innerHTML = Object.keys(TRACK).map((id) => `<button data-track="${id}" class="${id === track ? "on" : ""}">${TRACK[id][lang]}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach((b) => (b.onclick = () => { track = b.dataset.track; renderBoard(); }));
  const tb = tracks.find((x) => x.id === track);
  const ranked = (tb?.entries ?? []).filter((e) => !e.baseline);
  const base = tb?.entries.find((e) => e.baseline);
  if (!ranked.length && !base) { $("#board").innerHTML = `<div class="empty">${esc(t.none)}</div>`; $("#boardFoot").textContent = ""; return; }
  const row = (e) => `<tr class="${e.baseline ? "baseline" : ""}"><td class="num">${e.rank ?? "—"}</td><td>${esc(e.baseline ? t.baseline : e.model)}${e.provider && e.provider !== "none" ? ` <span class="muted small">${esc(e.provider)}</span>` : ""}${e.complete || e.baseline ? "" : ` <span class="muted small">(${t.partial})</span>`}</td>
    <td><div class="bar"><i style="width:${Math.max(e.openedRate ? 4 : 0, Math.round(e.openedRate * 100))}%"></i></div></td><td class="num"><b>${pct(e.openedRate)}</b></td>
    <td class="num muted">${pct(e.ci95[0])}–${pct(e.ci95[1])}</td><td class="num">${e.invalidPerRun}</td><td class="num">${e.tokensPerRun.toLocaleString()}</td><td class="num">${e.runs}/${tb.runsRequired}</td></tr>`;
  $("#board").innerHTML = (ranked.length ? "" : `<div class="empty" style="margin-bottom:12px">${esc(t.none)}</div>`) +
    `<table class="board"><thead><tr><th>#</th><th>${t.model}</th><th></th><th class="num">${t.opened}</th><th class="num">${t.ci}</th><th class="num">${t.invalid}</th><th class="num">${t.tokens}</th><th class="num">${t.runs}</th></tr></thead><tbody>${[...ranked, ...(base ? [base] : [])].map(row).join("")}</tbody></table>`;
  $("#boardFoot").textContent = tb ? t.foot(tb, board) : "";
  const h = $("#humans");
  if (community && community.runs > 0) { h.style.display = ""; h.innerHTML = t.humans(community); } else h.style.display = "none";
}
function renderFinals() {
  const t = T[lang];
  const list = finals.filter((f) => f.track === (lang === "tr" ? "trial-tr" : "trial-en")).concat(finals.filter((f) => f.track !== (lang === "tr" ? "trial-tr" : "trial-en"))).slice(0, 12);
  $("#finalsList").innerHTML = list.length ? list.map((f) => `<div class="fw"><q>${esc(f.text)}</q><div class="small"><b>${esc(f.model)}</b> <span class="muted">· ${esc(f.provider)} · ${esc(TRACK[f.track]?.[lang] ?? f.track)}</span></div>
    <div class="small">${f.path ? esc(t.road[f.path] ?? f.path) + " · " : ""}<span class="${f.passed ? "ok" : "no"}">${f.passed ? t.passed : t.failed}</span></div></div>`).join("") : `<div class="empty">${esc(t.nofinals)}</div>`;
}
document.querySelectorAll(".lang button").forEach((b) => (b.onclick = () => { lang = b.dataset.l; history.replaceState(null, "", `?lang=${lang}${location.hash}`); render(); }));
Promise.all([getJSON("data/leaderboard.json"), getJSON("data/finals.json"), getJSON("media/media.json"), getJSON("site.json"), getJSON("data/community.json"), getJSON("data/arena.json")]).then(([b, f, m, s, c, a]) => {
  board = b; finals = f ?? []; media = m ?? {}; site = s ?? {}; community = c; arena = a;
  if (lang === "tr") track = "trial-tr";
  render();
});
</script>
</body>
</html>
